<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1">
<title>MyDesk — 개인 정리함</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0e1524">
<style>
  :root{
    --paper:#0e1524;
    --paper-raised:#24365f;
    --paper-raised-2:#2d4272;
    --ink:#eef1f4;
    --ink-soft:#93a0ac;
    --ink-faint:#5c6874;
    --line:#3d5488;
    --line-soft:#304670;
    --accent:#eef1f4;
    --dashboard:#b48ee8;  /* 대시보드 - 자수정 */
    --dashboard-bg:rgba(180,142,232,0.14);
    --notes:#8fa8e8;      /* 메모 - 인디고 */
    --notes-bg:rgba(143,168,232,0.14);
    --todo:#f0b429;       /* 할 일 - 머스타드 */
    --todo-bg:rgba(240,180,41,0.14);
    --work:#7fc98a;       /* 업무 - 올리브그린 */
    --work-bg:rgba(127,201,138,0.14);
    --shop:#4fd0c0;       /* 쇼핑 - 틸 */
    --shop-bg:rgba(79,208,192,0.14);
    --remind:#ef6e85;     /* 리마인더 - 로즈 */
    --remind-bg:rgba(239,110,133,0.14);
    --check:#3ecf8e;      /* 완료 체크 표시 색 */
    --radius-lg:18px;
    --radius-md:14px;
    --radius-sm:10px;
    --shadow: 0 1px 2px rgba(0,0,0,0.2), 0 4px 14px rgba(0,0,0,0.24);
    --shadow-lg: 0 4px 16px rgba(0,0,0,0.3), 0 16px 40px rgba(0,0,0,0.4);
    --ease: cubic-bezier(.22,1,.36,1);
  }
  *{box-sizing:border-box;}
  body{
    margin:0;color:var(--ink);font-family:'Inter',sans-serif;-webkit-font-smoothing:antialiased;
    background:
      radial-gradient(ellipse 900px 500px at 8% -10%, rgba(180,142,232,0.10), transparent),
      radial-gradient(ellipse 700px 500px at 100% 0%, rgba(79,208,192,0.08), transparent),
      var(--paper);
    background-attachment:fixed;
  }
  h1,h2,h3,.display{font-family:'Fraunces',serif;letter-spacing:-0.01em;}
  .mono{font-family:'IBM Plex Mono',monospace;}
  button{font-family:inherit;cursor:pointer;}
  ::selection{background:var(--todo); color:#161c26;}
  @media (prefers-reduced-motion: reduce){ *{animation-duration:0.01ms !important; transition-duration:0.01ms !important;} }

  /* ---------- 로그인 화면 ---------- */
  #login-screen{
    min-height:100vh;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:22px;
  }
  #login-screen .badge{
    width:60px;height:60px;border-radius:16px;
    background:linear-gradient(150deg, var(--dashboard) 0%, #6d4a96 100%);
    color:#fff;box-shadow:var(--shadow-lg);
    display:flex;align-items:center;justify-content:center;font-family:'Fraunces',serif;font-size:26px;font-weight:600;
  }
  #login-screen h1{font-size:30px;margin:0;letter-spacing:-0.02em;font-weight:600;}
  #login-screen p{color:var(--ink-soft);margin:0;font-size:14.5px;}
  #google-signin{
    display:flex;align-items:center;gap:10px;background:var(--paper-raised);border:1px solid var(--line);
    padding:12px 22px;border-radius:10px;font-weight:600;font-size:15px;box-shadow:var(--shadow);
    transition:transform .15s ease, box-shadow .15s ease;
  }
  #google-signin:hover{transform:translateY(-2px);box-shadow:var(--shadow-lg);}
  #login-error{color:var(--remind);font-size:13px;max-width:320px;text-align:center;display:none;}

  /* ---------- 앱 셸 ---------- */
  #app{display:none;min-height:100vh;flex-direction:column;}
  #app.active{display:flex;}

  /* 상단 고정 헤더 - 인사말/날짜 항상 표시 */
  #topbar{
    position:fixed;top:0;left:0;right:0;z-index:50;
    background:rgba(14,21,36,0.82);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
    border-bottom:1px solid var(--line);
    padding:16px 24px;display:flex;align-items:center;justify-content:space-between;gap:10px;
  }
  #topbar .greeting{color:var(--ink-faint);font-size:11.5px;margin:0 0 3px;letter-spacing:.02em;}
  #topbar h1{font-size:21px;margin:0;letter-spacing:-0.015em;font-weight:600;}
  #signout{background:none;border:1px solid var(--line);border-radius:var(--radius-sm);padding:7px 13px;font-size:12px;color:var(--ink-soft);transition:border-color .15s ease, color .15s ease;flex-shrink:0;}
  #signout:hover{border-color:var(--ink-soft);color:var(--ink);}

  #main{flex:1;min-width:0;padding:86px 24px 100px;max-width:640px;margin:0 auto;width:100%;}

  .section{display:none;animation:fadeIn .35s var(--ease);}
  .section.active{display:block;}
  @keyframes fadeIn{ from{opacity:0;transform:translateY(4px);} to{opacity:1;transform:translateY(0);} }

  /* 하단 고정 탭 바 */
  #tab-rail{
    position:fixed;bottom:0;left:0;right:0;z-index:50;
    display:flex;justify-content:space-around;align-items:stretch;gap:2px;
    background:rgba(16,23,39,0.88);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);
    border-top:1px solid var(--line);
    padding:8px 6px calc(8px + env(safe-area-inset-bottom));
  }
  .tab-btn{
    flex:1;max-width:96px;border:none;border-radius:var(--radius-sm);background:none;
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;padding:7px 2px 6px;
    transition:background .18s var(--ease), transform .18s var(--ease);
  }
  .tab-btn .ico{font-size:18px;opacity:0.55;transition:opacity .2s ease, transform .2s ease;}
  .tab-btn .lbl{font-size:10px;font-weight:600;color:var(--ink-faint);letter-spacing:.02em;transition:color .2s ease;}
  .tab-btn:active{transform:scale(0.94);}
  .tab-btn.active .ico{opacity:1;transform:translateY(-1px);}
  .tab-btn.active[data-tab="dashboard"]{background:var(--dashboard-bg);}
  .tab-btn.active[data-tab="notes"]{background:var(--notes-bg);}
  .tab-btn.active[data-tab="todo"]{background:var(--todo-bg);}
  .tab-btn.active[data-tab="work"]{background:var(--work-bg);}
  .tab-btn.active[data-tab="shop"]{background:var(--shop-bg);}
  .tab-btn.active[data-tab="remind"]{background:var(--remind-bg);}
  .tab-btn.active[data-tab="dashboard"] .lbl{color:var(--dashboard);}
  .tab-btn.active[data-tab="notes"] .lbl{color:var(--notes);}
  .tab-btn.active[data-tab="todo"] .lbl{color:var(--todo);}
  .tab-btn.active[data-tab="work"] .lbl{color:var(--work);}
  .tab-btn.active[data-tab="shop"] .lbl{color:var(--shop);}
  .tab-btn.active[data-tab="remind"] .lbl{color:var(--remind);}

  /* 빠른 추가 바 */
  .add-bar{display:flex;gap:8px;margin-bottom:24px;flex-wrap:wrap;}
  .add-bar input, .add-bar select{
    font-family:inherit;font-size:13.5px;padding:11px 14px;border-radius:var(--radius-sm);border:1px solid var(--line);
    background:var(--paper-raised);color:var(--ink);box-shadow:0 1px 2px rgba(28,42,51,0.03);
    transition:border-color .15s ease, box-shadow .15s ease;
  }
  .add-bar input[type=text]{flex:1;min-width:180px;}
  .add-bar input:focus, .add-bar select:focus{outline:none;border-color:var(--ink-soft);box-shadow:0 0 0 3px rgba(28,42,51,0.06);}
  .add-bar button.add-submit{
    border:none;border-radius:var(--radius-sm);padding:11px 22px;font-weight:600;font-size:13.5px;color:#fff;
    box-shadow:0 2px 6px rgba(28,42,51,0.14);transition:transform .15s ease, box-shadow .15s ease, filter .15s ease;
  }
  .add-bar button.add-submit:hover{transform:translateY(-1px);filter:brightness(1.06);}
  .add-bar button.add-submit:active{transform:translateY(0);}
  #notes .add-submit{background:var(--notes);}
  #todo .add-submit{background:var(--todo);}
  #work .add-submit{background:var(--work);}
  #shop .add-submit{background:var(--shop);}
  #remind .add-submit{background:var(--remind);}

  /* 카드 리스트 */
  .card-list{display:flex;flex-direction:column;gap:9px;}
  .card{
    background:var(--paper-raised);border:1px solid var(--line-soft);border-radius:var(--radius-md);padding:16px 18px;box-shadow:var(--shadow);
    display:flex;align-items:flex-start;gap:12px;transition:box-shadow .2s var(--ease), transform .2s var(--ease), border-color .2s var(--ease);
  }
  .card:hover{box-shadow:var(--shadow-lg);transform:translateY(-1px);border-color:var(--line);}
  .card .grip{width:4px;align-self:stretch;border-radius:4px;flex-shrink:0;}
  #notes .grip{background:var(--notes);}
  #todo .grip{background:var(--todo);}
  #work .grip{background:var(--work);}
  #shop .grip{background:var(--shop);}
  #remind .grip{background:var(--remind);}
  .card .content{flex:1;min-width:0;}
  .card .title{font-weight:600;font-size:14.5px;margin:0 0 4px;word-break:break-word;letter-spacing:-0.005em;}
  .card .meta{font-size:11.5px;color:var(--ink-soft);}
  .card .body-text{font-size:13.5px;color:var(--ink-soft);margin-top:6px;white-space:pre-wrap;word-break:break-word;}
  .card.done{opacity:0.6;}
  .card.done .title{text-decoration:line-through;color:var(--ink-soft);}

  /* 메모 전용 - 제목 클릭시 펼쳐지는 스타일 */
  #notes .card{flex-direction:column;align-items:stretch;gap:0;padding:0;overflow:hidden;}
  #notes .card:hover{transform:none;}
  #notes .card .top-row{display:flex;align-items:center;gap:12px;padding:4px 6px 4px 18px;}
  #notes .title-btn{
    flex:1;min-width:0;background:none;border:none;text-align:left;padding:13px 0;
    display:flex;align-items:center;gap:9px;
  }
  #notes .title-btn .chevron{font-size:10px;color:var(--ink-faint);transition:transform .2s var(--ease);flex-shrink:0;}
  #notes .title-btn.expanded .chevron{transform:rotate(90deg);color:var(--notes);}
  #notes .card .title{font-size:15.5px;font-family:'Fraunces',serif;font-weight:600;margin:0;}
  #notes .note-divider{height:1px;background:var(--line-soft);margin:0 18px;}
  .note-body{
    width:100%;border:none;resize:none;outline:none;overflow:hidden;
    font-family:'Inter',sans-serif;font-size:14px;line-height:24px;color:var(--ink);
    padding:14px 18px 18px;min-height:78px;box-sizing:border-box;
  }
  .note-body::placeholder{color:var(--ink-faint);}
  .card .actions{display:flex;gap:4px;flex-shrink:0;}

  /* 업무 탭 - 파일 첨부 */
  .attach-row{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px;border-radius:8px;outline:none;padding:2px;}
  .attach-row:focus{box-shadow:0 0 0 2px var(--work);}
  .attach-chip{
    display:flex;align-items:center;gap:6px;background:var(--paper-raised-2);border:1px solid var(--line);
    border-radius:8px;padding:6px 10px;font-size:12px;color:var(--ink-soft);text-decoration:none;max-width:180px;
  }
  .attach-chip img{width:22px;height:22px;object-fit:cover;border-radius:4px;flex-shrink:0;}
  .attach-chip span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .attach-chip .remove-x{margin-left:2px;color:var(--remind);flex-shrink:0;}
  .file-input-label{
    display:inline-flex;align-items:center;gap:6px;font-size:13px;color:var(--ink-soft);
    border:1px dashed var(--line);border-radius:8px;padding:8px 12px;cursor:pointer;background:var(--paper-raised);
  }
  .file-input-label:hover{border-color:var(--work);color:var(--work);}
  .upload-progress{font-size:11px;color:var(--work);margin-top:4px;}

  /* 알림 설정 패널 */
  .notif-panel{
    background:var(--paper-raised);border:1px solid var(--line-soft);border-radius:12px;padding:14px 18px;margin-bottom:20px;
    display:flex;align-items:center;justify-content:space-between;gap:12px;box-shadow:var(--shadow);flex-wrap:wrap;
  }
  .notif-panel .notif-status{font-size:13px;color:var(--ink-soft);display:flex;align-items:center;gap:8px;}
  .notif-dot{width:8px;height:8px;border-radius:50%;background:#aaa;flex-shrink:0;}
  .notif-dot.on{background:var(--shop);}
  .notif-dot.off{background:var(--remind);}
  .notif-panel button{
    background:var(--remind);color:#fff;border:none;border-radius:var(--radius-sm);padding:8px 14px;font-size:12.5px;font-weight:600;
    transition:transform .15s ease, filter .15s ease;
  }
  .notif-panel button:hover{transform:translateY(-1px);filter:brightness(1.08);}
  .icon-btn{background:none;border:none;padding:6px;border-radius:var(--radius-sm);color:var(--ink-faint);font-size:14px;transition:background .15s ease, color .15s ease;}
  .icon-btn:hover{background:var(--paper);color:var(--ink);}
  .checkbox{width:19px;height:19px;border-radius:6px;border:1.5px solid var(--line);flex-shrink:0;margin-top:1px;
    display:flex;align-items:center;justify-content:center;font-size:12px;color:#fff;transition:all .15s ease;cursor:pointer;}
  .checkbox:hover{border-color:var(--ink-soft);}
  .checkbox.checked{background:var(--check);border-color:var(--check);color:#0b0f15;}
  .pin-star{color:var(--todo);}
  .priority-high{color:var(--remind);font-weight:700;}
  .priority-mid{color:var(--todo);font-weight:700;}
  .priority-low{color:var(--ink-soft);}

  .empty-state{padding:64px 20px;text-align:center;color:var(--ink-faint);}
  .empty-state .display{font-size:19px;color:var(--ink-soft);margin-bottom:6px;font-weight:600;}

  .toast{
    position:fixed;bottom:88px;left:50%;transform:translateX(-50%) translateY(20px);
    background:var(--paper-raised-2);color:var(--ink);border:1px solid var(--line);padding:10px 20px;border-radius:var(--radius-sm);font-size:13px;
    box-shadow:var(--shadow-lg);
    opacity:0;transition:all .25s var(--ease);pointer-events:none;z-index:999;
  }
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0);}

  /* ---------- 대시보드 ---------- */
  .dash-stats{display:flex;flex-direction:column;gap:10px;margin-bottom:32px;}
  .dash-stat{
    background:var(--paper-raised);border:1px solid var(--line-soft);border-left:3px solid transparent;
    border-radius:var(--radius-md);padding:15px 17px;box-shadow:var(--shadow);
    cursor:pointer;transition:transform .18s var(--ease), box-shadow .18s var(--ease), border-color .18s var(--ease);text-align:left;
    display:flex;flex-direction:column;gap:10px;font-family:inherit;width:100%;
  }
  .dash-stat:hover{transform:translateX(2px);box-shadow:var(--shadow-lg);}
  .dash-stat .stat-top{display:flex;align-items:center;gap:10px;}
  .dash-stat .stat-icon{font-size:15px;width:28px;height:28px;border-radius:8px;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
  .dash-stat .stat-label{font-size:12.5px;color:var(--ink-soft);font-weight:600;}
  .dash-stat .stat-num{font-family:'Fraunces',serif;font-size:19px;font-weight:600;line-height:1;color:var(--ink);margin-left:auto;}
  .dash-stat .stat-chevron{color:var(--ink-faint);font-size:12px;}
  .dash-stat .stat-preview{display:flex;flex-direction:column;gap:5px;padding-left:38px;}
  .dash-stat .preview-line{font-size:12.5px;color:var(--ink-soft);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
    display:flex;align-items:center;gap:7px;}
  .dash-stat .preview-line::before{content:'';width:4px;height:4px;border-radius:50%;background:var(--ink-faint);flex-shrink:0;}
  .dash-stat .preview-empty{font-size:12.5px;color:var(--ink-faint);padding-left:38px;font-style:italic;}
  .dash-stat[data-tab="dashboard"]{border-left-color:var(--dashboard);}
  .dash-stat[data-tab="todo"]{border-left-color:var(--todo);}
  .dash-stat[data-tab="work"]{border-left-color:var(--work);}
  .dash-stat[data-tab="shop"]{border-left-color:var(--shop);}
  .dash-stat[data-tab="remind"]{border-left-color:var(--remind);}
  .dash-stat[data-tab="notes"]{border-left-color:var(--notes);}
  .dash-stat[data-tab="dashboard"] .stat-icon{background:var(--dashboard-bg);}
  .dash-stat[data-tab="todo"] .stat-icon{background:var(--todo-bg);}
  .dash-stat[data-tab="work"] .stat-icon{background:var(--work-bg);}
  .dash-stat[data-tab="shop"] .stat-icon{background:var(--shop-bg);}
  .dash-stat[data-tab="remind"] .stat-icon{background:var(--remind-bg);}
  .dash-stat[data-tab="notes"] .stat-icon{background:var(--notes-bg);}

  .dash-section{margin-bottom:30px;}
  .dash-section h2{font-size:14px;font-weight:600;color:var(--ink-soft);margin:0 0 12px;letter-spacing:.01em;
    display:flex;align-items:center;gap:8px;text-transform:uppercase;font-family:'Inter',sans-serif;font-size:11.5px;letter-spacing:.06em;}
  .dash-row{
    background:var(--paper-raised);border:1px solid var(--line-soft);border-radius:var(--radius-md);padding:13px 16px;box-shadow:var(--shadow);
    display:flex;align-items:center;gap:12px;margin-bottom:8px;cursor:pointer;
    transition:transform .15s var(--ease), box-shadow .15s var(--ease), border-color .15s var(--ease);
  }
  .dash-row:hover{border-color:var(--line);}
  .dash-row:hover{transform:translateX(2px);box-shadow:var(--shadow-lg);}
  .dash-row .dot{width:7px;height:7px;border-radius:50%;flex-shrink:0;}
  .dash-row .row-title{flex:1;min-width:0;font-size:13.5px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .dash-row .row-meta{font-size:11.5px;color:var(--ink-faint);flex-shrink:0;}
  .dash-empty{color:var(--ink-faint);font-size:13px;padding:6px 2px 0;}

  @media (max-width:640px){
    #main{padding:80px 16px 96px;}
    .tab-btn .lbl{font-size:9px;}
  }
</style>
</head>

<body>

<!-- ================= 로그인 화면 ================= -->
<div id="login-screen">
  <div class="badge">MD</div>
  <h1>MyDesk</h1>
  <p>메모 · 할 일 · 쇼핑 리스트 · 리마인더 — 나만의 정리함</p>
  <form id="login-form" style="display:flex;flex-direction:column;gap:10px;width:260px;">
    <input type="password" id="login-passphrase" placeholder="암호 입력" required
      style="padding:13px 15px;border-radius:var(--radius-sm);border:1px solid var(--line);font-size:14px;font-family:inherit;background:var(--paper-raised);box-shadow:0 1px 2px rgba(28,42,51,0.03);">
    <button type="submit" id="login-submit"
      style="background:linear-gradient(150deg, var(--dashboard) 0%, #6d4a96 100%);color:#fff;border:none;border-radius:var(--radius-sm);padding:13px;font-weight:600;font-size:14px;box-shadow:var(--shadow-lg);transition:transform .15s ease;">
      입장
    </button>
  </form>
  <p id="login-error"></p>
</div>

<!-- ================= 앱 셸 ================= -->
<div id="app">
  <nav id="tab-rail">
    <button class="tab-btn active" data-tab="dashboard"><span class="ico">🏠</span><span class="lbl">홈</span></button>
    <button class="tab-btn" data-tab="notes"><span class="ico">🗒️</span><span class="lbl">메모</span></button>
    <button class="tab-btn" data-tab="todo"><span class="ico">✅</span><span class="lbl">할 일</span></button>
    <button class="tab-btn" data-tab="work"><span class="ico">💼</span><span class="lbl">업무</span></button>
    <button class="tab-btn" data-tab="shop"><span class="ico">🛒</span><span class="lbl">쇼핑</span></button>
    <button class="tab-btn" data-tab="remind"><span class="ico">⏰</span><span class="lbl">리마인더</span></button>
  </nav>

  <main id="main">
    <div id="topbar">
      <div>
        <p class="greeting mono" id="topbar-greeting"></p>
        <h1 id="section-title">홈</h1>
      </div>
      <button id="signout">나가기</button>
    </div>

    <!-- 대시보드 -->
    <section class="section active" id="dashboard">
      <div class="dash-stats" id="dash-stats"></div>
      <div class="dash-section">
        <h2>다가오는 리마인더</h2>
        <div id="dash-reminders"></div>
      </div>
      <div class="dash-section">
        <h2>고정된 메모</h2>

function renderDashboard(){
  const stats = document.getElementById('dash-stats');
  if (!stats) return; // 대시보드 DOM이 아직 없으면 무시

  const now = new Date();
  const hour = now.getHours();
  const greetWord = hour < 6 ? '늦은 밤이네요' : hour < 12 ? '좋은 아침이에요' : hour < 18 ? '좋은 오후예요' : '좋은 저녁이에요';
  document.getElementById('topbar-greeting').textContent = `${greetWord} · ${now.toLocaleDateString('ko-KR',{month:'long', day:'numeric', weekday:'short'})}`;

  const pendingTodoItems = latestTodoItems.filter(t=>!t.done);
  const pendingWorkItems = latestWorkItems.filter(w=>!w.done);
  const pendingShopItems = latestShopItems.filter(s=>!s.done);
  const upcomingRemindItems = [...latestReminderItems].filter(r=>r.enabled).sort((a,b)=> new Date(a.dueAt)-new Date(b.dueAt));
  const notesForPreview = [...latestNoteItems].sort((a,b)=> (b.pinned===true)-(a.pinned===true));

  const statDefs = [
    {tab:'todo', icon:'✅', num:pendingTodoItems.length, label:'할 일', preview:pendingTodoItems.slice(0,3).map(t=>t.text), emptyMsg:'남은 할 일이 없어요'},
    {tab:'work', icon:'💼', num:pendingWorkItems.length, label:'업무', preview:pendingWorkItems.slice(0,3).map(w=>w.text), emptyMsg:'남은 업무가 없어요'},
    {tab:'shop', icon:'🛒', num:pendingShopItems.length, label:'쇼핑', preview:pendingShopItems.slice(0,3).map(s=>s.item), emptyMsg:'쇼핑 리스트가 비어있어요'},
    {tab:'remind', icon:'⏰', num:upcomingRemindItems.length, label:'리마인더', preview:upcomingRemindItems.slice(0,3).map(r=>r.text), emptyMsg:'예약된 리마인더가 없어요'},
    {tab:'notes', icon:'🗒️', num:notesForPreview.length, label:'메모', preview:notesForPreview.slice(0,3).map(n=>n.title), emptyMsg:'아직 메모가 없어요'},
  ];
  stats.innerHTML = statDefs.map(s => `
    <button class="dash-stat" data-tab="${s.tab}">
      <div class="stat-top">
        <span class="stat-icon">${s.icon}</span>
        <span class="stat-label">${s.label}</span>
        <span class="stat-num">${s.num}</span>
        <span class="stat-chevron">›</span>
      </div>
      ${s.preview.length
        ? `<div class="stat-preview">${s.preview.map(p=>`<div class="preview-line">${escapeHtml(p)}</div>`).join('')}</div>`
        : `<div class="preview-empty">${s.emptyMsg}</div>`}
    </button>`).join('');
  stats.querySelectorAll('.dash-stat').forEach(b => b.onclick = () => switchTab(b.dataset.tab));

  // 다가오는 리마인더 (활성화된 것 중 가장 빠른 3개)
  const remindBox = document.getElementById('dash-reminders');
  const upcoming = latestReminderItems.filter(r=>r.enabled).sort((a,b)=> new Date(a.dueAt)-new Date(b.dueAt)).slice(0,3);
  if (!upcoming.length) {
    remindBox.innerHTML = `<div class="dash-empty">예약된 리마인더가 없어요.</div>`;
  } else {
    remindBox.innerHTML = upcoming.map(r => {
      const dt = new Date(r.dueAt);
      return `<div class="dash-row" data-tab="remind">
        <span class="dot" style="background:var(--remind)"></span>
        <span class="row-title">${escapeHtml(r.text)}</span>
        <span class="row-meta mono">${dt.toLocaleString('ko-KR',{month:'numeric',day:'numeric',hour:'2-digit',minute:'2-digit'})}</span>
      </div>`;
    }).join('');
  }

  // 고정된 메모
  const pinnedBox = document.getElementById('dash-pinned-notes');
  const pinned = latestNoteItems.filter(n=>n.pinned).slice(0,4);
  if (!pinned.length) {
    pinnedBox.innerHTML = `<div class="dash-empty">고정된 메모가 없어요. 메모 제목 옆 📍를 눌러 고정해보세요.</div>`;
  } else {
    pinnedBox.innerHTML = pinned.map(n => `
      <div class="dash-row" data-tab="notes">
        <span class="dot" style="background:var(--notes)"></span>
        <span class="row-title">★ ${escapeHtml(n.title)}</span>
      </div>`).join('');
  }

  // 우선순위 높은 할 일/업무
  const priorityBox = document.getElementById('dash-priority');
  const highTodo = latestTodoItems.filter(t=>!t.done && t.priority==='high').map(t=>({...t, kind:'todo'}));
  const highWork = latestWorkItems.filter(w=>!w.done && w.priority==='high').map(w=>({...w, kind:'work'}));
  const highItems = [...highTodo, ...highWork].slice(0,5);
  if (!highItems.length) {
    priorityBox.innerHTML = `<div class="dash-empty">높은 우선순위 항목이 없어요.</div>`;
  } else {
    priorityBox.innerHTML = highItems.map(item => `
      <div class="dash-row" data-tab="${item.kind}">
        <span class="dot" style="background:var(--${item.kind === 'todo' ? 'todo' : 'work'})"></span>
        <span class="row-title">${escapeHtml(item.text)}</span>
        <span class="row-meta">${item.kind === 'todo' ? '할 일' : '업무'}</span>
      </div>`).join('');
  }

  document.querySelectorAll('#dash-reminders .dash-row, #dash-pinned-notes .dash-row, #dash-priority .dash-row')
    .forEach(row => row.onclick = () => switchTab(row.dataset.tab));
}

// ---------------- 메모 ----------------
const expandedNotes = new Set(); // 지금 펼쳐진 메모 id들 (로컬 UI 상태, 저장 안 됨)
let latestNoteItems = [];

document.getElementById('notes-add-btn').onclick = async () => {
  const input = document.getElementById('notes-title-input');
  if (!input.value.trim()) return;
  const ref = await addDoc(col('notes'), { title: input.value.trim(), body:'', pinned:false, createdAt: serverTimestamp() });

  input.value = '';
};
document.getElementById('notes-title-input').addEventListener('keydown', e=>{ if(e.key==='Enter') document.getElementById('notes-add-btn').click(); });

function buildNoteCard(n){
  const el = document.createElement('div');
  el.className = 'card';
  el.dataset.noteId = n.id;
  const expanded = expandedNotes.has(n.id);
  el.innerHTML = `
    <div class="top-row">
      <button class="title-btn ${expanded?'expanded':''}" type="button">
        <span class="chevron">▶</span>
        <p class="title">${n.pinned?'<span class=\"pin-star\">★</span> ':''}${escapeHtml(n.title)}</p>
      </button>
      <div class="actions">
        <button class="icon-btn pin-btn" data-id="${n.id}" data-pinned="${n.pinned}">${n.pinned?'📌':'📍'}</button>
        <button class="icon-btn del-btn" data-id="${n.id}">✕</button>
      </div>
    </div>
    ${expanded ? `<div class="note-divider"></div>
    <textarea class="note-body" data-id="${n.id}" placeholder="여기에 내용을 적어보세요...">${escapeHtml(n.body||'')}</textarea>` : ''}`;

  const titleBtn = el.querySelector('.title-btn');
  const pinBtn = el.querySelector('.pin-btn');
  const delBtn = el.querySelector('.del-btn');

  titleBtn.onclick = () => {
    if (expandedNotes.has(n.id)) expandedNotes.delete(n.id); else expandedNotes.add(n.id);
    renderNotesList();
  };
  pinBtn.onclick = () => updateDoc(doc(db,'users',uid,'notes',n.id), {pinned: pinBtn.dataset.pinned !== 'true'});
  delBtn.onclick = () => { expandedNotes.delete(n.id); deleteDoc(doc(db,'users',uid,'notes',n.id)); };

  if (expanded) {
    const ta = el.querySelector('.note-body');
    let timer;
    ta.addEventListener('input', () => {
      autoGrow(ta);
      clearTimeout(timer);
      timer = setTimeout(() => updateDoc(doc(db,'users',uid,'notes',n.id), {body: ta.value}), 600);
    });
    // 포커스를 잃을 때(입력 끝났을 때)만 화면을 다시 정리 - 입력 도중엔 절대 건드리지 않음
    ta.addEventListener('blur', () => renderNotesList());
    requestAnimationFrame(() => autoGrow(ta));
  }
  return el;
}

function renderNotesList(){
  const list = document.getElementById('notes-list');
  if (!latestNoteItems.length){ list.innerHTML = emptyState('아직 메모가 없어요','위 입력창에 제목을 적고 추가해보세요.'); renderDashboard(); return; }
  list.innerHTML = '';
  latestNoteItems.forEach(n => list.appendChild(buildNoteCard(n)));
  if (window.__focusNoteId) {
    const ta = list.querySelector(`.note-body[data-id="${window.__focusNoteId}"]`);
    if (ta) ta.focus();
    window.__focusNoteId = null;
  }
  renderDashboard();
}

function listenNotes(){
  const q = query(col('notes'), orderBy('createdAt','desc'));
  unsubs.push(onSnapshot(q, snap=>{
    latestNoteItems = snap.docs.map(d=>({id:d.id, ...d.data()}));
    latestNoteItems.sort((a,b)=> (b.pinned===true) - (a.pinned===true));

    const list = document.getElementById('notes-list');
    const activeEl = document.activeElement;
    const isEditingNote = activeEl && activeEl.classList && activeEl.classList.contains('note-body') && list.contains(activeEl);
    if (isEditingNote) return; // 지금 입력 중이면 화면을 절대 건드리지 않음 (포커스 보존)

    renderNotesList();
  }));
}

// ---------------- 할 일 ----------------
document.getElementById('todo-add-btn').onclick = async () => {
  const input = document.getElementById('todo-input');
  const pr = document.getElementById('todo-priority').value;
  if (!input.value.trim()) return;
  await addDoc(col('todo'), { text: input.value.trim(), done:false, priority: pr, createdAt: serverTimestamp() });
  input.value = '';
};
document.getElementById('todo-input').addEventListener('keydown', e=>{ if(e.key==='Enter') document.getElementById('todo-add-btn').click(); });

let latestTodoItems = [];
function listenTodo(){
  const q = query(col('todo'), orderBy('createdAt','desc'));
  unsubs.push(onSnapshot(q, snap=>{
    latestTodoItems = snap.docs.map(d=>({id:d.id, ...d.data()}));
    const list = document.getElementById('todo-list');
    if (snap.empty){ list.innerHTML = emptyState('할 일이 없어요','새로운 할 일을 추가해보세요.'); renderDashboard(); return; }
    const order = {high:0, mid:1, low:2};
    let items = [...latestTodoItems];
    items.sort((a,b)=> (a.done - b.done) || (order[a.priority]-order[b.priority]));
    list.innerHTML = '';
    items.forEach(t=>{
      const el = document.createElement('div');
      el.className = 'card' + (t.done?' done':'');
      const prClass = t.priority==='high'?'priority-high':t.priority==='mid'?'priority-mid':'priority-low';
      const prLabel = t.priority==='high'?'높음':t.priority==='mid'?'보통':'낮음';
      el.innerHTML = `
        <div class="checkbox ${t.done?'checked':''}" data-id="${t.id}" data-done="${t.done}">${t.done?'✓':''}</div>
        <div class="content">
          <p class="title">${escapeHtml(t.text)}</p>
          <div class="meta ${prClass}">${prLabel}</div>
        </div>
        <div class="actions"><button class="icon-btn del-btn" data-id="${t.id}">✕</button></div>`;
      list.appendChild(el);
    });
    list.querySelectorAll('.checkbox').forEach(c=>c.onclick=()=>updateDoc(doc(db,'users',uid,'todo',c.dataset.id),{done: c.dataset.done!=='true'}));
    list.querySelectorAll('.del-btn').forEach(b=>b.onclick=()=>deleteDoc(doc(db,'users',uid,'todo',b.dataset.id)));
    renderDashboard();
  }));
}

  const pr = document.getElementById('work-priority').value;

  input.value = '';

document.getElementById('work-input').addEventListener('keydown', e=>{ if(e.key==='Enter') document.getElementById('work-add-btn').click(); });

function fileIcon(type){
  if (type && type.startsWith('image/')) return null; // 이미지는 썸네일로 보여줌
  return '📄';
}

async function uploadWorkFile(workId, file, progressEl){
  if (file.size > 10 * 1024 * 1024) { toast('10MB 이하 파일만 업로드 가능합니다'); return; }
  const path = `users/${uid}/work/${workId}/${Date.now()}_${file.name}`;
  const sref = storageRef(storage, path);
  if (progressEl) progressEl.textContent = '업로드 중...';
  try {
    await uploadBytes(sref, file);
    const url = await getDownloadURL(sref);
    const workRef = doc(db, 'users', uid, 'work', workId);
    // 최신 첨부 목록을 가져와 추가 (동시성 이슈 최소화를 위해 현재 캐시된 목록 사용)
    const current = latestWorkItems.find(w=>w.id===workId);
    const attachments = [...(current?.attachments || []), { name: file.name, url, path, type: file.type }];
    await updateDoc(workRef, { attachments });
    if (progressEl) progressEl.textContent = '';
  } catch (e) {
    console.error(e);
    if (progressEl) progressEl.textContent = '';
    toast('업로드 실패: ' + e.message);
  }
}

async function removeWorkAttachment(workId, attachment){
  const current = latestWorkItems.find(w=>w.id===workId);
  if (!current) return;
  const attachments = (current.attachments || []).filter(a => a.path !== attachment.path);
  await updateDoc(doc(db,'users',uid,'work',workId), { attachments });
  try { await deleteObject(storageRef(storage, attachment.path)); } catch(e){ console.warn('스토리지 파일 삭제 실패(이미 지워졌을 수 있음):', e.message); }
}

let latestWorkItems = [];

function listenWork(){
  const q = query(col('work'), orderBy('createdAt','desc'));
  unsubs.push(onSnapshot(q, snap=>{
    latestWorkItems = snap.docs.map(d=>({id:d.id, ...d.data()}));
    const list = document.getElementById('work-list');
    if (!latestWorkItems.length){ list.innerHTML = emptyState('업무가 없어요','새로운 업무를 추가해보세요.'); renderDashboard(); return; }
    const order = {high:0, mid:1, low:2};
    const items = [...latestWorkItems].sort((a,b)=> (a.done - b.done) || (order[a.priority]-order[b.priority]));
    list.innerHTML = '';
    items.forEach(w=>{
      const el = document.createElement('div');
      el.className = 'card' + (w.done?' done':'');
      el.style.flexDirection = 'column';
      el.style.alignItems = 'stretch';
      const prClass = w.priority==='high'?'priority-high':w.priority==='mid'?'priority-mid':'priority-low';
      const prLabel = w.priority==='high'?'높음':w.priority==='mid'?'보통':'낮음';
      const attachments = w.attachments || [];
      const chipsHtml = attachments.map(a => {
        const isImg = a.type && a.type.startsWith('image/');
        return `<a class="attach-chip" href="${a.url}" target="_blank" rel="noopener" data-path="${a.path}">
          ${isImg ? `<img src="${a.url}" alt="">` : '<span>📄</span>'}
          <span>${escapeHtml(a.name)}</span>
          <span class="remove-x" data-path="${a.path}" data-work-id="${w.id}">✕</span>
        </a>`;
      }).join('');
      el.innerHTML = `
        <div style="display:flex;align-items:flex-start;gap:12px;">
          <div class="checkbox ${w.done?'checked':''}" data-id="${w.id}" data-done="${w.done}">${w.done?'✓':''}</div>
          <div class="content">
            <p class="title">${escapeHtml(w.text)}</p>
            <div class="meta ${prClass}">${prLabel}</div>
          </div>
          <div class="actions"><button class="icon-btn del-btn" data-id="${w.id}">✕</button></div>
        </div>
        <div class="attach-row" tabindex="0" data-work-id="${w.id}" title="여기를 클릭하고 Ctrl+V로 이미지를 붙여넣을 수 있어요">
          ${chipsHtml}
          <label class="file-input-label">
            📎 파일 추가 (또는 클릭 후 Ctrl+V)
            <input type="file" accept="application/pdf,image/*" data-id="${w.id}" style="display:none;">
          </label>
        </div>
        <div class="upload-progress" data-progress-for="${w.id}"></div>`;
      list.appendChild(el);
    });
    list.querySelectorAll('.checkbox').forEach(c=>c.onclick=()=>updateDoc(doc(db,'users',uid,'work',c.dataset.id),{done: c.dataset.done!=='true'}));
    list.querySelectorAll('.del-btn').forEach(b=>b.onclick=()=>deleteDoc(doc(db,'users',uid,'work',b.dataset.id)));
    list.querySelectorAll('input[type=file]').forEach(inp=>{
      inp.onchange = () => {
        const file = inp.files[0];
        if (!file) return;
        const progressEl = list.querySelector(`.upload-progress[data-progress-for="${inp.dataset.id}"]`);
        uploadWorkFile(inp.dataset.id, file, progressEl);
        inp.value = '';
      };
    });
    list.querySelectorAll('.remove-x').forEach(x=>{
      x.onclick = (e) => {
        e.preventDefault(); e.stopPropagation();
        removeWorkAttachment(x.dataset.workId, { path: x.dataset.path });
      };
    });
    list.querySelectorAll('.attach-row').forEach(row=>{
      row.addEventListener('paste', (e) => {
        const items = e.clipboardData?.items;
        if (!items) return;
        for (const item of items) {
          if (item.kind === 'file') {
            const file = item.getAsFile();
            if (!file) continue;
            const progressEl = list.querySelector(`.upload-progress[data-progress-for="${row.dataset.workId}"]`);
            uploadWorkFile(row.dataset.workId, file, progressEl);
          }
        }
      });
    });
    renderDashboard();
  }));
}

// ---------------- 리마인더 ----------------
const OFFSET_LABELS = {15:'15분 전', 30:'30분 전', 60:'1시간 전', 120:'2시간 전', 1440:'1일 전', 2880:'2일 전', 10080:'1주일 전', 20160:'2주일 전'};

document.getElementById('remind-add-btn').onclick = async () => {
  const input = document.getElementById('remind-input');
  const time = document.getElementById('remind-time');
  const repeat = document.getElementById('remind-repeat').value;
  const note = document.getElementById('remind-note').value.trim();
  const n1 = document.getElementById('remind-notify1').value;
  const n2 = document.getElementById('remind-notify2').value;
  const notifyOffsets = [...new Set([n1, n2].filter(v => v !== '').map(Number))];
  if (!input.value.trim() || !time.value) { toast('내용과 시간을 모두 입력해주세요'); return; }
  await addDoc(col('reminders'), {
    text: input.value.trim(),
    note,
    dueAt: new Date(time.value).toISOString(),
    repeat, notified:false, enabled:true, notifyOffsets, sentOffsets: [], createdAt: serverTimestamp()
  });
  input.value=''; time.value=''; document.getElementById('remind-note').value='';
  document.getElementById('remind-notify1').value='';
  document.getElementById('remind-notify2').value='';
};

let latestReminderItems = [];
function listenRemind(){
  const q = query(col('reminders'), orderBy('dueAt','asc'));
  unsubs.push(onSnapshot(q, snap=>{
    latestReminderItems = snap.docs.map(d=>({id:d.id, ...d.data()}));
    const list = document.getElementById('remind-list');
    if (!latestReminderItems.length){ list.innerHTML = emptyState('예약된 리마인더가 없어요','날짜/시간을 정해서 추가해보세요.'); renderDashboard(); return; }
    list.innerHTML = '';
    latestReminderItems.forEach(r=>{
      const dt = new Date(r.dueAt);
      const repeatLabel = r.repeat==='daily'?'매일 반복':r.repeat==='weekly'?'매주 반복':r.repeat==='yearly'?'매년 반복':'1회성';
      const offsets = r.notifyOffsets || [];
      const offsetLabel = offsets.length ? ' · 🔔 ' + offsets.map(o=>OFFSET_LABELS[o]||o).join(', ') : '';
      const el = document.createElement('div');
      el.className = 'card' + (!r.enabled?' done':'');
      el.innerHTML = `
        <div class="grip"></div>
        <div class="content">
          <p class="title">${escapeHtml(r.text)}</p>
          <div class="meta mono">${dt.toLocaleString('ko-KR')} · ${repeatLabel}${offsetLabel}</div>
          ${r.note ? `<div class="body-text">📍 ${escapeHtml(r.note)}</div>` : ''}
        </div>
        <div class="actions">
          <button class="icon-btn toggle-btn" data-id="${r.id}" data-enabled="${r.enabled}">${r.enabled?'🔔':'🔕'}</button>
          <button class="icon-btn del-btn" data-id="${r.id}">✕</button>
        </div>`;
      list.appendChild(el);
    });
    list.querySelectorAll('.toggle-btn').forEach(b=>b.onclick=()=>updateDoc(doc(db,'users',uid,'reminders',b.dataset.id),{enabled: b.dataset.enabled!=='true'}));
    list.querySelectorAll('.del-btn').forEach(b=>b.onclick=()=>deleteDoc(doc(db,'users',uid,'reminders',b.dataset.id)));
    renderDashboard();
  }));
}

// ---------------- FCM 푸시 등록 & 알림 설정 UI ----------------
function updateNotifStatus(){
  const dot = document.getElementById('notif-dot');
  const text = document.getElementById('notif-status-text');
  const btn = document.getElementById('notif-enable-btn');
  if (!dot) return;
  if (!('Notification' in window)) {
    dot.className = 'notif-dot off';
    text.textContent = '이 브라우저는 알림을 지원하지 않습니다';
    btn.style.display = 'none';
    return;
  }
  const perm = Notification.permission;
  if (perm === 'granted') {
    dot.className = 'notif-dot on';
    text.textContent = '리마인더 푸시 알림이 켜져 있습니다';
    btn.style.display = 'none';
  } else if (perm === 'denied') {
    dot.className = 'notif-dot off';
    text.textContent = '알림이 차단되어 있습니다 — 브라우저 주소창 왼쪽 아이콘에서 직접 허용해주세요';
    btn.textContent = '알림 켜기';
    btn.style.display = 'inline-block';
  } else {
    dot.className = 'notif-dot off';
    text.textContent = '알림이 꺼져 있습니다';
    btn.textContent = '알림 켜기';
    btn.style.display = 'inline-block';
  }
}

async function setupPush(forcePrompt = false){
  try {
    if (!('Notification' in window)) return;
    const supported = await isSupported();
    if (!supported) { updateNotifStatus(); return; }
    if (!('serviceWorker' in navigator)) return;
    if (!forcePrompt && Notification.permission !== 'granted') { updateNotifStatus(); return; }

    const reg = await navigator.serviceWorker.register('firebase-messaging-sw.js');
    const perm = await Notification.requestPermission();
    updateNotifStatus();
    if (perm !== 'granted') return;

    const messaging = getMessaging(app);
    const token = await getToken(messaging, { vapidKey: VAPID_KEY, serviceWorkerRegistration: reg });
    if (token) {
      await setDoc(doc(db, 'users', uid, 'meta', 'fcm'), { token, updatedAt: serverTimestamp() });
    }
  } catch (e) {
    console.warn('푸시 설정 실패:', e.message);
    updateNotifStatus();
  }
}

document.getElementById('notif-enable-btn').onclick = () => setupPush(true);

// ---------------- 유틸 ----------------
function escapeHtml(str){
  const d = document.createElement('div');
  d.textContent = str || '';
  return d.innerHTML;
}
function emptyState(title, sub){
  return `<div class="empty-state"><div class="display">${title}</div><div>${sub}</div></div>`;
}
function autoGrow(ta){
  ta.style.height = 'auto';
  ta.style.height = Math.max(ta.scrollHeight, 78) + 'px';
}
